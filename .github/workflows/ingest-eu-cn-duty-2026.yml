name: Ingest EU CN 2026 duties
on:
  push:
    branches: [main]
    paths:
      - scripts/ingest-eu-cn-duty-2026.py
      - .github/workflows/ingest-eu-cn-duty-2026.yml
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * 1"
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl
      - name: Ingest CN 2026 conventional duties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest-eu-cn-duty-2026.py
