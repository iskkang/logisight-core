name: Ingest EU Classification Evidence
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Official EU classification evidence source (optional)"
        required: false
  push:
    branches: [main]
    paths:
      - "scripts/ingest-eu-classification-regulations-2026.py"
      - ".github/workflows/ingest-eu-classification-evidence.yml"
  schedule:
    - cron: "40 4 * * 1"
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber supabase
      - run: python scripts/ingest-eu-classification-regulations-2026.py
        env:
          EU_CLASS_EVIDENCE_URL: ${{ inputs.source_url || secrets.EU_CLASS_EVIDENCE_URL || 'https://taxation-customs.ec.europa.eu/news/big-step-simplification-commission-publishes-consolidated-list-classification-regulations-2025-05-12_en' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
