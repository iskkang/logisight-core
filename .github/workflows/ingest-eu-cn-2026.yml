name: Ingest EU CN 2026

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "openpyxl==3.1.5" "requests==2.32.5"
      - name: Download, validate and ingest CN 2026
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest-eu-cn-2026.py
