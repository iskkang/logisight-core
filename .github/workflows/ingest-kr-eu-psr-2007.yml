name: Ingest KR-EU PSR and Crosswalk
on:
  push:
    branches: [main]
    paths:
      - scripts/ingest-kr-eu-psr-2007.py
      - .github/workflows/ingest-kr-eu-psr-2007.yml
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests beautifulsoup4
      - name: Ingest official KCS HS2007 PSR and HS2022→HS2007 crosswalk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest-kr-eu-psr-2007.py
