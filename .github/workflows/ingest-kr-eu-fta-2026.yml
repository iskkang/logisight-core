name: Ingest Korea-EU FTA CN8
on:
  push:
    branches: [main]
    paths:
      - scripts/ingest-kr-eu-fta-2026.py
      - .github/workflows/ingest-kr-eu-fta-2026.yml
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * 1"
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Ingest KR-EU FTA preference snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest-kr-eu-fta-2026.py
